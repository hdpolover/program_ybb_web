<!DOCTYPE html>
<html>
<head>
    <title>Compare Button Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.7/css/boxicons.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>
<body>
    <div class="container mt-5">
        <div class="card">
            <div class="card-header">
                <h5>Compare Button Test</h5>
                <p class="text-muted mb-0">This page tests the compare version functionality.</p>
            </div>
            <div class="card-body">
                <h6>Version History Mock</h6>
                <div class="mb-3">
                    <div class="d-flex align-items-center justify-content-between p-3 border rounded">
                        <div>
                            <span class="badge bg-success">v2</span>
                            <strong>Latest Version</strong>
                            <small class="text-muted d-block">2024-01-15 14:30:00</small>
                        </div>
                        <div>
                            <button class="btn btn-primary btn-sm">Edit</button>
                        </div>
                    </div>
                </div>
                
                <div class="mb-3">
                    <div class="d-flex align-items-center justify-content-between p-3 border rounded">
                        <div>
                            <span class="badge bg-secondary">v1</span>
                            <strong>Previous Version</strong>
                            <small class="text-muted d-block">2024-01-10 10:15:00</small>
                        </div>
                        <div>
                            <button class="btn btn-secondary btn-sm">View</button>
                            <button type="button" class="btn btn-outline-secondary btn-sm compare-version-btn"
                                    data-version-id="9"
                                    data-compare-with="5">
                                <i class="bx bx-git-compare me-1"></i> Compare with Latest
                            </button>
                        </div>
                    </div>
                </div>

                <hr>
                
                <h6>Direct Test Links</h6>
                <div class="d-grid gap-2">
                    <a href="/abstract-paper/compare/5/9" class="btn btn-outline-primary">
                        <i class="bx bx-git-compare me-1"></i> Direct Compare Link (v5 vs v9)
                    </a>
                    <button class="btn btn-outline-info" onclick="testCompareFunction()">
                        <i class="bx bx-bug me-1"></i> Test JavaScript Compare Function
                    </button>
                </div>
            </div>
        </div>

        <div class="card mt-4">
            <div class="card-header">
                <h6>Console Output</h6>
            </div>
            <div class="card-body">
                <div id="console-output" class="bg-dark text-light p-3 rounded" style="font-family: monospace; max-height: 300px; overflow-y: auto;">
                    <!-- Console output will appear here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Include the abstract paper view JS -->
    <script>
        // Console logging override to capture output
        const originalLog = console.log;
        const originalError = console.error;
        const consoleOutput = document.getElementById('console-output');

        function addToConsole(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const color = type === 'error' ? 'text-danger' : type === 'warn' ? 'text-warning' : 'text-light';
            consoleOutput.innerHTML += `<div class="${color}">[${timestamp}] ${message}</div>`;
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
        }

        console.log = function(...args) {
            originalLog.apply(console, args);
            addToConsole(args.join(' '), 'log');
        };

        console.error = function(...args) {
            originalError.apply(console, args);
            addToConsole(args.join(' '), 'error');
        };

        // Test function
        function testCompareFunction() {
            console.log('Testing compare function...');
            
            // Check if compareVersions function exists
            if (typeof compareVersions === 'function') {
                console.log('compareVersions function found, calling with test IDs...');
                compareVersions('5', '9');
            } else {
                console.error('compareVersions function not found!');
                console.log('Attempting to load the function from abstract-paper-view.js...');
                
                // Try to dynamically load the script
                const script = document.createElement('script');
                script.src = '/assets/js/abstract-paper-view.js';
                script.onload = function() {
                    console.log('Script loaded successfully');
                    if (typeof compareVersions === 'function') {
                        console.log('compareVersions function now available, calling...');
                        compareVersions('5', '9');
                    } else {
                        console.error('compareVersions function still not available after loading script');
                    }
                };
                script.onerror = function() {
                    console.error('Failed to load abstract-paper-view.js');
                };
                document.head.appendChild(script);
            }
        }

        // Setup compare button event listener
        document.addEventListener('DOMContentLoaded', function() {
            console.log('DOM loaded, setting up compare button listener...');
            
            const compareButtons = document.querySelectorAll('.compare-version-btn');
            console.log(`Found ${compareButtons.length} compare buttons`);
            
            compareButtons.forEach(button => {
                button.addEventListener('click', function(e) {
                    e.preventDefault();
                    const versionId = this.getAttribute('data-version-id');
                    const compareWithId = this.getAttribute('data-compare-with');
                    
                    console.log(`Compare button clicked: ${versionId} vs ${compareWithId}`);
                    
                    if (versionId && compareWithId) {
                        if (typeof compareVersions === 'function') {
                            compareVersions(versionId, compareWithId);
                        } else {
                            console.error('compareVersions function not available');
                            // Fallback to direct navigation
                            const url = `/abstract-paper/compare/${compareWithId}/${versionId}`;
                            console.log(`Falling back to direct navigation: ${url}`);
                            window.location.href = url;
                        }
                    }
                });
            });
        });
    </script>
</body>
</html>
