<!DOCTYPE html>
<html>
<head>
    <title>Test Participant Search</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; color: #155724; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; color: #0c5460; }
        button { padding: 10px 20px; margin: 5px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        input[type="email"] { padding: 8px; width: 300px; margin: 5px; border: 1px solid #ddd; border-radius: 3px; }
        #result { margin-top: 20px; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Participant Search Functionality</h1>
        
        <div class="test-section">
            <h3>Test 1: Direct API Call</h3>
            <p>This test calls the API directly to verify the participant exists.</p>
            <button onclick="testDirectAPI()">Test Direct API</button>
            <div id="directResult"></div>
        </div>
        
        <div class="test-section">
            <h3>Test 2: Controller Search Endpoint</h3>
            <p>This test calls the controller's search endpoint that the frontend uses.</p>
            <input type="email" id="searchEmail" value="hendrapolover@gmail.com" placeholder="Enter email">
            <input type="text" id="programId" value="7" placeholder="Program ID" style="width: 100px;">
            <button onclick="testControllerSearch()">Test Controller Search</button>
            <div id="controllerResult"></div>
        </div>
        
        <div id="result"></div>
    </div>

    <script>
        function testDirectAPI() {
            const resultDiv = document.getElementById('directResult');
            resultDiv.innerHTML = '<p>Testing direct API call...</p>';
            
            const email = 'hendrapolover@gmail.com';
            const programId = '7';
            const url = `https://admin.ybbfoundation.com/api/participants/search?email=${encodeURIComponent(email)}&program_id=${encodeURIComponent(programId)}`;
            
            fetch(url, {
                method: 'GET',
                headers: {
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                console.log('Direct API Response Status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Direct API Response Data:', data);
                resultDiv.innerHTML = `
                    <div class="success">
                        <h4>✓ Direct API Call Successful</h4>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    </div>
                `;
            })
            .catch(error => {
                console.error('Direct API Error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>✗ Direct API Call Failed</h4>
                        <p>Error: ${error.message}</p>
                        <p>Note: This may fail due to CORS restrictions in the browser.</p>
                    </div>
                `;
            });
        }
        
        function testControllerSearch() {
            const resultDiv = document.getElementById('controllerResult');
            const email = document.getElementById('searchEmail').value;
            const programId = document.getElementById('programId').value;
            
            if (!email || !programId) {
                resultDiv.innerHTML = '<div class="error">Please enter both email and program ID</div>';
                return;
            }
            
            resultDiv.innerHTML = '<p>Testing controller search endpoint...</p>';
            
            const url = `/abstract-paper/search-participant?email=${encodeURIComponent(email)}&program_id=${encodeURIComponent(programId)}`;
            
            fetch(url, {
                method: 'GET',
                headers: {
                    'X-Requested-With': 'XMLHttpRequest',
                    'Accept': 'application/json',
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                console.log('Controller Response Status:', response.status);
                return response.json();
            })
            .then(data => {
                console.log('Controller Response Data:', data);
                if (data.success) {
                    resultDiv.innerHTML = `
                        <div class="success">
                            <h4>✓ Controller Search Successful</h4>
                            <p><strong>Found:</strong> ${data.found ? 'Yes' : 'No'}</p>
                            <p><strong>Message:</strong> ${data.message}</p>
                            ${data.participant ? `
                                <h5>Participant Details:</h5>
                                <ul>
                                    <li><strong>ID:</strong> ${data.participant.id}</li>
                                    <li><strong>Name:</strong> ${data.participant.full_name}</li>
                                    <li><strong>Email:</strong> ${data.participant.email}</li>
                                    <li><strong>Institution:</strong> ${data.participant.institution || 'N/A'}</li>
                                </ul>
                            ` : ''}
                            <h5>Full Response:</h5>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    resultDiv.innerHTML = `
                        <div class="error">
                            <h4>✗ Controller Search Failed</h4>
                            <p><strong>Message:</strong> ${data.message}</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                }
            })
            .catch(error => {
                console.error('Controller Error:', error);
                resultDiv.innerHTML = `
                    <div class="error">
                        <h4>✗ Controller Search Failed</h4>
                        <p>Error: ${error.message}</p>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
