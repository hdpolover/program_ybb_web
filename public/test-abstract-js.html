<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Abstract JavaScript</title>
    <!-- jQuery -->
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <!-- SweetAlert2 -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <!-- Bootstrap for styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons -->
    <link href="https://cdn.jsdelivr.net/npm/boxicons@2.0.9/css/boxicons.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
    <h2>Abstract JavaScript Test Page</h2>
    <p>This page tests the abstract-version-manager.js functions.</p>
    
    <!-- Test form similar to the actual abstract form -->
    <form id="test-form" class="mt-4">
        <input type="hidden" name="program_id" value="1">
        <input type="hidden" name="primary_participant_id" value="1">
        <input type="hidden" name="abstract_id" value="1">
        <input type="hidden" name="version_id" value="">
        <input type="hidden" name="content" value="">
        
        <div class="mb-3">
            <label for="abstract_topic_id" class="form-label">Topic</label>
            <select name="abstract_topic_id" id="abstract_topic_id" class="form-select">
                <option value="">Select a topic</option>
                <option value="1">Test Topic 1</option>
                <option value="2">Test Topic 2</option>
            </select>
        </div>
        
        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input type="text" name="title" id="title" class="form-control" value="Test Abstract Title">
        </div>
        
        <div class="mb-3">
            <label for="keywords" class="form-label">Keywords</label>
            <input type="text" name="keywords" id="keywords" class="form-control" value="test, keywords, javascript">
        </div>
        
        <div class="mb-3">
            <label for="refs" class="form-label">References</label>
            <textarea name="refs" id="refs" class="form-control" rows="3">Test reference content</textarea>
        </div>
        
        <div class="mb-3">
            <button type="button" id="save-draft-btn" class="btn btn-secondary">
                <i class="bx bx-save me-1"></i> Save Draft
            </button>
            <button type="button" id="submit-btn" class="btn btn-primary">
                <i class="bx bx-check-circle me-1"></i> Submit Abstract
            </button>
        </div>
    </form>
    
    <!-- Test buttons for individual functions -->
    <div class="mt-5">
        <h4>Test Individual Functions</h4>
        <button id="test-success-response" class="btn btn-success me-2">Test Success Response</button>
        <button id="test-error-response" class="btn btn-danger me-2">Test Error Response</button>
        <button id="test-loading-dialog" class="btn btn-info me-2">Test Loading Dialog</button>
        <button id="test-api-call" class="btn btn-warning">Test API Call (Mock)</button>
    </div>
    
    <div class="mt-5">
        <h4>Console Output</h4>
        <div id="console-output" class="bg-light p-3 rounded" style="height: 300px; overflow-y: auto; font-family: monospace;"></div>
    </div>

    <!-- Load the abstract version manager -->
    <script src="/assets/js/abstract-version-manager.js"></script>
    
    <script>
        // Override console.log to show in our output div
        const originalConsoleLog = console.log;
        const originalConsoleError = console.error;
        const consoleOutput = document.getElementById('console-output');
        
        function addToConsole(message, type = 'log') {
            const timestamp = new Date().toLocaleTimeString();
            const div = document.createElement('div');
            div.className = type === 'error' ? 'text-danger' : '';
            div.textContent = `[${timestamp}] ${type.toUpperCase()}: ${message}`;
            consoleOutput.appendChild(div);
            consoleOutput.scrollTop = consoleOutput.scrollHeight;
            
            // Still call original console methods
            if (type === 'error') {
                originalConsoleError(message);
            } else {
                originalConsoleLog(message);
            }
        }
        
        console.log = function(message) {
            addToConsole(message, 'log');
        };
        
        console.error = function(message) {
            addToConsole(message, 'error');
        };
        
        $(document).ready(function() {
            console.log('Test page loaded successfully');
            
            // Setup the abstract handlers
            function testValidateForm(isSubmit) {
                const title = $('#title').val().trim();
                const topicId = $('#abstract_topic_id').val();
                
                if (!topicId) {
                    console.log('Validation failed: No topic selected');
                    return false;
                }
                
                if (!title) {
                    console.log('Validation failed: No title provided');
                    return false;
                }
                
                console.log('Validation passed');
                return true;
            }
            
            function testContentExtractor() {
                // Simulate extracting content from a rich text editor
                const content = 'This is test abstract content that would come from Quill editor.';
                $('input[name="content"]').val(content);
                console.log('Content extracted:', content);
                return content;
            }
            
            // Setup the handlers
            setupAbstractVersionHandlers(
                '#test-form',
                '#save-draft-btn',
                '#submit-btn',
                testContentExtractor,
                testValidateForm,
                {
                    redirectUrl: '/test-redirect',
                    autoRedirect: false // Don't redirect for testing
                }
            );
            
            // Test button handlers
            $('#test-success-response').click(function() {
                console.log('Testing success response...');
                const mockResponse = {
                    status: 'success',
                    message: 'Abstract saved successfully',
                    data: {
                        abstract_version: {
                            id: 123,
                            title: 'Test Abstract Title',
                            version_number: 1,
                            updated_at: new Date().toISOString(),
                            status: 'draft'
                        },
                        status: 'draft'
                    }
                };
                
                handleSaveResponse(mockResponse, 'draft', 
                    function(data) {
                        console.log('Success callback called with data:', data);
                    },
                    function(error) {
                        console.error('Error callback called:', error);
                    }
                );
            });
            
            $('#test-error-response').click(function() {
                console.log('Testing error response...');
                const mockError = {
                    status: 422,
                    responseText: JSON.stringify({
                        status: 'error',
                        message: 'Validation failed',
                        data: {
                            errors: {
                                title: 'Title is required',
                                content: 'Content cannot be empty'
                            }
                        }
                    })
                };
                
                handleSaveError(mockError, 'error', 'Test error', 
                    function(error) {
                        console.error('Error callback called:', error);
                    }
                );
            });
            
            $('#test-loading-dialog').click(function() {
                console.log('Testing loading dialog...');
                
                const saveAlert = Swal.fire({
                    title: 'Testing Loading Dialog',
                    html: `
                        <div class="text-start">
                            <p class="mb-2"><i class="bx bx-save me-2"></i> Testing the loading dialog...</p>
                            <p class="mb-3"><small class="text-muted">This is just a test. Please wait.</small></p>
                            <div class="progress mb-2" style="height: 8px;">
                                <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
                                     role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" 
                                     style="width: 100%"></div>
                            </div>
                            <div class="d-flex justify-content-center">
                                <div class="spinner-border spinner-border-sm text-primary" role="status">
                                    <span class="visually-hidden">Loading...</span>
                                </div>
                            </div>
                        </div>
                    `,
                    icon: 'info',
                    showConfirmButton: false,
                    allowOutsideClick: false,
                    allowEscapeKey: false
                });
                
                // Close after 3 seconds
                setTimeout(() => {
                    Swal.close();
                    console.log('Loading dialog closed');
                }, 3000);
            });
            
            $('#test-api-call').click(function() {
                console.log('Testing mock API call...');
                
                // Mock the saveAbstractVersion function
                const formData = {
                    program_id: $('input[name="program_id"]').val(),
                    primary_participant_id: $('input[name="primary_participant_id"]').val(),
                    abstract_topic_id: $('#abstract_topic_id').val(),
                    title: $('#title').val(),
                    keywords: $('#keywords').val(),
                    refs: $('#refs').val(),
                    content: testContentExtractor()
                };
                
                console.log('Form data prepared:', formData);
                
                // Simulate the AJAX call
                const mockSaveFunction = function() {
                    // Show loading dialog
                    const saveAlert = Swal.fire({
                        title: 'Saving Draft',
                        html: `
                            <div class="text-start">
                                <p class="mb-2"><i class="bx bx-save me-2"></i> Saving your draft abstract...</p>
                                <p class="mb-3"><small class="text-muted">This may take a few moments. Please don't close this window.</small></p>
                                <div class="progress mb-2" style="height: 8px;">
                                    <div class="progress-bar progress-bar-striped progress-bar-animated bg-primary" 
                                         role="progressbar" aria-valuenow="100" aria-valuemin="0" aria-valuemax="100" 
                                         style="width: 100%"></div>
                                </div>
                                <div class="d-flex justify-content-center">
                                    <div class="spinner-border spinner-border-sm text-primary" role="status">
                                        <span class="visually-hidden">Loading...</span>
                                    </div>
                                </div>
                            </div>
                        `,
                        icon: 'info',
                        showConfirmButton: false,
                        allowOutsideClick: false,
                        allowEscapeKey: false
                    });
                    
                    // Simulate API response after 2 seconds
                    setTimeout(() => {
                        const mockResponse = {
                            status: 'success',
                            message: 'Draft saved successfully',
                            data: {
                                abstract_version: {
                                    id: 456,
                                    title: $('#title').val(),
                                    version_number: 1,
                                    updated_at: new Date().toISOString(),
                                    status: 'draft'
                                },
                                status: 'draft'
                            }
                        };
                        
                        handleSaveResponse(mockResponse, 'draft', 
                            function(data) {
                                console.log('Mock API success callback called with data:', data);
                            },
                            function(error) {
                                console.error('Mock API error callback called:', error);
                            }
                        );
                    }, 2000);
                };
                
                mockSaveFunction();
            });
            
            console.log('All test handlers set up successfully');
        });
    </script>
</body>
</html>
