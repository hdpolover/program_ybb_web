<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper Upload Test</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
</head>
<body>
    <div class="container mt-5">
        <h2>Test Abstract Paper Upload Functionality</h2>
        
        <!-- Test the modal trigger button -->
        <button type="button" class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#uploadPaperModal">
            <i class="bx bx-upload me-1"></i> Test Upload Modal
        </button>
        
        <!-- Test form validation -->
        <div class="mt-4">
            <h4>Quick Form Validation Test</h4>
            <form action="#" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
                <div class="mb-3">
                    <label for="testFile" class="form-label">Select PDF File</label>
                    <input type="file" class="form-control" id="testFile" name="paper_file" accept=".pdf" required>
                    <div class="invalid-feedback">Please select a PDF file.</div>
                </div>
                <div class="mb-3">
                    <label for="testVersion" class="form-label">Version</label>
                    <input type="text" class="form-control" id="testVersion" name="paper_version" value="1.0" required>
                    <div class="invalid-feedback">Please enter a version.</div>
                </div>
                <button type="submit" class="btn btn-success">Test Submit</button>
            </form>
        </div>
    </div>

    <!-- Upload Modal (mimicking the actual modal) -->
    <div class="modal fade" id="uploadPaperModal" tabindex="-1" aria-labelledby="uploadPaperModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="uploadPaperModalLabel">Upload Full Paper</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form action="#" method="post" enctype="multipart/form-data">
                    <div class="modal-body">
                        <div class="alert alert-info mb-4">
                            <i class="bx bx-info-circle me-1"></i> Please upload your full paper in PDF format. Maximum file size: 10MB.
                        </div>

                        <div class="mb-3">
                            <label for="paperFile" class="form-label">Select Paper File (PDF)</label>
                            <input type="file" class="form-control" id="paperFile" name="paper_file" accept=".pdf" required>
                        </div>

                        <div class="mb-3">
                            <label for="paperVersion" class="form-label">Version</label>
                            <input type="text" class="form-control" id="paperVersion" name="paper_version" value="1.0" required>
                        </div>

                        <div class="mb-3">
                            <label for="paperNotes" class="form-label">Notes (Optional)</label>
                            <textarea class="form-control" id="paperNotes" name="paper_notes" rows="3" placeholder="Any additional notes about your paper..."></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-light" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" class="btn btn-success">
                            <i class="bx bx-upload me-1"></i> Upload Paper
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        // Basic form validation
        (function() {
            'use strict';
            window.addEventListener('load', function() {
                var forms = document.getElementsByClassName('needs-validation');
                var validation = Array.prototype.filter.call(forms, function(form) {
                    form.addEventListener('submit', function(event) {
                        if (form.checkValidity() === false) {
                            event.preventDefault();
                            event.stopPropagation();
                        } else {
                            event.preventDefault();
                            alert('Form would be submitted! Check the console for form data.');
                            console.log('Form data:', new FormData(form));
                        }
                        form.classList.add('was-validated');
                    }, false);
                });
            }, false);
        })();

        // Test file size validation
        document.addEventListener('DOMContentLoaded', function() {
            const fileInputs = document.querySelectorAll('input[type="file"]');
            fileInputs.forEach(input => {
                input.addEventListener('change', function() {
                    const file = this.files[0];
                    if (file) {
                        // Check file type
                        if (file.type !== 'application/pdf') {
                            alert('Only PDF files are allowed.');
                            this.value = '';
                            return;
                        }
                        
                        // Check file size (10MB limit)
                        if (file.size > 10 * 1024 * 1024) {
                            alert('File size must be less than 10MB.');
                            this.value = '';
                            return;
                        }
                        
                        console.log('File validated successfully:', file.name, 'Size:', (file.size / 1024 / 1024).toFixed(2) + 'MB');
                    }
                });
            });
        });
    </script>
</body>
</html>
